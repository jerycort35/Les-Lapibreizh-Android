name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore stable signing key
        env:
          KEYSTORE_B64: ${{ secrets.LAPIBREIZH_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/lapibreizh.jks"

      - name: Build signed release APK
        env:
          LAPIBREIZH_KEYSTORE_PATH: ${{ runner.temp }}/lapibreizh.jks
          LAPIBREIZH_KEYSTORE_PASSWORD: ${{ secrets.LAPIBREIZH_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Les-Lapibreizh-V04-SIGNED
          path: app/build/outputs/apk/release/app-release.apk
